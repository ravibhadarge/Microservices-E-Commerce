# Per-environment overrides for the ecommerce chart.
# services.<name>.tag and loadgenerator.image.tag are written by Jenkins
# (scripts/update-image-tag.sh) and equal the Jenkins build number of that service.
# Everything else in this file is safe to edit by hand; Argo CD applies it on commit.
namespace: production
image:
  tag: "latest"
  pullPolicy: IfNotPresent
application:
  replicas: 3
ingress:
  enabled: true
  host: ecommerce.example.com
  scheme: internet-facing
  targetType: ip
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  cpuUtilization: 65
  memoryUtilization: 75
postgres:
  enabled: true
  database: ecommerce
  username: ecommerce
  password: CHANGE_ME_USE_SECRETS_MANAGER
  storage:
    size: 50Gi
    storageClassName: gp3
redis:
  enabled: true
loadgenerator:
  enabled: false
  image:
    tag: "7"
services:
  adservice:
    tag: "10"
  backend:
    tag: "1"
  cartservice:
    tag: "10"
  checkoutservice:
    tag: "10"
  currencyservice:
    tag: "7"
  emailservice:
    tag: "2"
  frontend:
    tag: "7"
  paymentservice:
    tag: "6"
  productcatalogservice:
    tag: "7"
  recommendationservice:
    tag: "2"
  shippingservice:
    tag: "7"
