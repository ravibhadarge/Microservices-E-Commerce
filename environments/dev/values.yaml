# Per-environment overrides for the ecommerce chart.
# services.<name>.tag and loadgenerator.image.tag are written by Jenkins
# (scripts/update-image-tag.sh) and equal the Jenkins build number of that service.
# Everything else in this file is safe to edit by hand; Argo CD applies it on commit.
namespace: dev
image:
  tag: "dev"
  pullPolicy: IfNotPresent
application:
  replicas: 1
ingress:
  enabled: true
  host: dev.example.com
  scheme: internet-facing
  targetType: ip
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  cpuUtilization: 70
  memoryUtilization: 80
postgres:
  enabled: true
  database: ecommerce
  username: ecommerce
  password: ecommercepassword
  storage:
    size: 10Gi
    storageClassName: gp3
redis:
  enabled: true
loadgenerator:
  enabled: true
  replicas: 1
  users: "10"
  image:
    tag: "7"
services:
  adservice:
    tag: "10"
  backend:
    tag: "1"
  cartservice:
    tag: "10"
  checkoutservice:
    tag: "10"
  currencyservice:
    tag: "7"
  emailservice:
    tag: "2"
  frontend:
    tag: "7"
  paymentservice:
    tag: "6"
  productcatalogservice:
    tag: "7"
  recommendationservice:
    tag: "2"
  shippingservice:
    tag: "7"
