# Per-environment overrides for the ecommerce chart.
# services.<name>.tag and loadgenerator.image.tag are written by Jenkins
# (scripts/update-image-tag.sh) and equal the Jenkins build number of that service.
# Everything else in this file is safe to edit by hand; Argo CD applies it on commit.
namespace: dev
image:
  tag: "dev"
  pullPolicy: IfNotPresent
application:
  replicas: 1
ingress:
  enabled: true
  host: dev.example.com
  scheme: internet-facing
  targetType: ip
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  cpuUtilization: 70
  memoryUtilization: 80
postgres:
  enabled: true
  database: ecommerce
  username: ecommerce
  password: ecommercepassword
  storage:
    size: 10Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: 100m
redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
loadgenerator:
  enabled: false
  replicas: 1
  users: "10"
  image:
    tag: "7"
services:
  adservice:
    tag: "10"
    resources:
      requests:
        cpu: 25m
  backend:
    tag: "1"
    resources:
      requests:
        cpu: 25m
  cartservice:
    tag: "10"
    resources:
      requests:
        cpu: 25m
  checkoutservice:
    tag: "10"
    resources:
      requests:
        cpu: 25m
  currencyservice:
    tag: "7"
    resources:
      requests:
        cpu: 25m
  emailservice:
    tag: "2"
    resources:
      requests:
        cpu: 25m
  frontend:
    tag: "7"
    resources:
      requests:
        cpu: 25m
  paymentservice:
    tag: "6"
    resources:
      requests:
        cpu: 25m
  productcatalogservice:
    tag: "7"
    resources:
      requests:
        cpu: 25m
  recommendationservice:
    tag: "2"
    resources:
      requests:
        cpu: 25m
  shippingservice:
    tag: "7"
    resources:
      requests:
        cpu: 25m
