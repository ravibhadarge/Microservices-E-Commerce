namespace: dev

image:
  tag: "latest"
  pullPolicy: IfNotPresent

application:
  replicas: 2

ingress:
  enabled: true
  host: dev.example.com
  scheme: internet-facing
  targetType: ip

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 70
  memoryUtilization: 80

postgres:
  enabled: true
  database: ecommerce
  username: ecommerce
  password: ecommercepassword
  storage:
    size: 10Gi
    storageClassName: gp3

redis:
  enabled: true

loadgenerator:
  enabled: true
  replicas: 1
  users: "10"
