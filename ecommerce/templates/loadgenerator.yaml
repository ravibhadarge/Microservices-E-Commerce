{{- if .Values.loadgenerator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  namespace: {{ .Values.namespace }}
  labels:
    app: loadgenerator
spec:
  replicas: {{ .Values.loadgenerator.replicas }}
  selector:
    matchLabels:
      app: loadgenerator
  template:
    metadata:
      labels:
        app: loadgenerator
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      initContainers:
        - name: frontend-check
          image: {{ .Values.loadgenerator.image.repository }}:{{ .Values.image.tag }}
          command:
            - /bin/sh
            - -exc
            - |
              echo "Checking frontend..."
              STATUSCODE=$(wget --server-response http://frontend:80 2>&1 | awk '/^  HTTP/{print $2}')
              if [ "$STATUSCODE" != "200" ]; then
                echo "Frontend check failed: ${STATUSCODE}"
                exit 1
              fi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true

          env:
            - name: FRONTEND_ADDR
              value: "frontend:80"

      containers:
        - name: loadgenerator
          image: {{ .Values.loadgenerator.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true

          env:
            - name: FRONTEND_ADDR
              value: "frontend:80"

            - name: USERS
              value: {{ .Values.loadgenerator.users | quote }}
{{- end }}
